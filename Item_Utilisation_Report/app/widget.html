<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Billing Status Report</title>
  <link rel="stylesheet" href="style.css">
  <!-- Zoho Creator SDK -->
  <script src="https://js.zohostatic.com/creator/sdk/v1.0/ZohoEmbededAppSDK.min.js"></script>
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk.js"></script>
  <script src="https://js.zohostatic.com/creator/widgets/version/2.0/widgetsdk-min.js"></script>
  <!-- Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
</head>

<body>

<!-- LOADING OVERLAY -->
<div id="fxLoader" class="fx-loader is-active" role="status" aria-live="polite"> <!-- ⬅️ CHANGED — added "is-active" so it's visible immediately on first paint, before any JS runs -->
  <div class="fx-grid"></div>

  <div class="fx-panel">
    <span class="fx-corner tl"></span><span class="fx-corner tr"></span>
    <span class="fx-corner bl"></span><span class="fx-corner br"></span>
    <span class="fx-scan"></span>

    <div class="fx-orb">
      <span class="fx-ring fx-ring--1"></span>
      <span class="fx-ring fx-ring--2"></span>
      <span class="fx-ring fx-ring--3"></span>
      <span class="fx-orbit"><i></i></span>
      <span class="fx-core fx-core--logo"><img
          src="https://creatorapp.zohopublic.com.au/file//medielves/claims-management//All_Images/31559000000025010/Logo/image-download/PFxHZm68ZwuMKfkZz7yNOH7BZEes8UQN5ETOHD0bVY8Njqf0b9Zw5ZTe2XUK0CONRVfdmbQ9wteQdDnbWNCN4kVaeRZQhFrE6Tp5?filepath=/1774517256590556_Logo_design_with_green_leaf_accent.png"
          alt="Medi Elves"></span>
    </div>

    <h3 class="fx-title">
      Loading claims data
      <span class="fx-dots"><i></i><i></i><i></i></span>
    </h3>

    <p class="fx-status"><span id="fxStatus">Initializing secure connection</span></p>

    <div class="fx-bar"><span id="fxBarFill"></span></div>
    <div class="fx-meta"><span>DATA SYNC</span><span id="fxPct">0%</span></div>
  </div>
</div>
  <div class="container">

    <header class="report-header">
      <div class="report-header-inner">
        <div class="report-header-brand">
          <img
            src="https://creatorapp.zohopublic.com.au/file//medielves/claims-management//All_Images/31559000000025010/Logo/image-download/PFxHZm68ZwuMKfkZz7yNOH7BZEes8UQN5ETOHD0bVY8Njqf0b9Zw5ZTe2XUK0CONRVfdmbQ9wteQdDnbWNCN4kVaeRZQhFrE6Tp5?filepath=/1774517256590556_Logo_design_with_green_leaf_accent.png"
            alt="Logo" class="report-logo">
        </div>
        <div class="report-header-title">
          <span class="report-header-spacer"></span>
          <h1>Item Utilisation Report</h1>
          <button type="button" class="btn-back" id="btn-back" onclick="navigateBackToPortal()" aria-label="Back to Portal Home" title="Back to Portal Home">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Back</span>
          </button>
        </div>
      </div>
    </header>

    <!-- FILTERS -->
    <div class="filter-card">
      <div class="filter-grid">

        <div class="filter-group">
          <label>Doctor</label>
          <div id="f-doctor"></div>
        </div>

        <div class="filter-group">
          <label>Location</label>
          <div id="f-location"></div>
        </div>



        <div class="filter-group">
          <label>Patient</label>
          <div id="f-patient"></div>
        </div>

        <div class="filter-group">
          <label>Item Number</label>
          <div id="f-itemnumber"></div>
        </div>

        <div class="filter-group">
          <label>From Date</label>
          <input type="date" id="f-from" />
        </div>

        <div class="filter-group">
          <label>To Date</label>
          <input type="date" id="f-to" />
        </div>

      </div>

      <div class="action-row">
        <button class="btn btn-primary" onclick="runReport()">Update</button>
        <button class="btn btn-reset" onclick="resetFilters()">Reset</button>

        <div class="export-menu" id="export-menu">
          <button class="export-icon-btn" id="export-icon-btn" title="Export report" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V4"></path>
              <path d="M7 8l5-5 5 5"></path>
              <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
            </svg>
          </button>
          <div class="export-dropdown" id="export-dropdown">
            <button type="button" class="export-option" id="export-pdf-opt">
              <span class="export-option-icon pdf-icon">PDF</span>
              <span>Export as PDF</span>
            </button>
            <button type="button" class="export-option" id="export-excel-opt">
              <span class="export-option-icon excel-icon">XLS</span>
              <span>Export as Excel</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-card">
      <div class="table-scroll">
        <table>
<colgroup>
  <col style="width:150px">
  <col style="width:160px">
  <col style="width:190px">
  <col style="width:110px">   <!-- Status -->
  <col style="width:110px">   <!-- Date of Service -->
  <col style="width:110px">   <!-- Payment Date -->
  <col style="width:110px">
  <col style="width:90px">
  <col style="width:340px">
  <col style="width:120px">
  <col style="width:140px">
</colgroup>
          <thead>
            <tr>
<tr>
  <th>Doctor</th>
  <th>Hospital</th>
  <th>Patient</th>
  <th>Claim Status</th>
  <th>Date of Service</th>
  <th>Payment Date</th>
  <th>Item Number</th>
  <th>Type</th>
  <th>Description</th>
  <th>Usage Count</th>
  <th>Billed Amount</th>
</tr>
          </thead>
          <tbody id="report-body">
            <tr>
              <td colspan="11">No data</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- GRAND SUMMARY -->
    <div class="summary-card" id="report-summary">
      <!-- populated by renderSummary() -->
    </div>
  </div>
  <script src="script.js"></script>
</body>

</html>
